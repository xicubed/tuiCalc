<!doctype html>
<html><head><meta charset="utf-8"><title>Rhombic Hexecontahedron — after Spikey</title>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
 :root{--paper:#f4f1e6;--ink:#1f4e9a;--grid:#7fa6d6}
 body{background:var(--paper);margin:0;padding:20px;font-family:'Architects Daughter','Courier New',monospace;color:var(--ink)}
 .sheet{max-width:900px;margin:0 auto;border:5px solid var(--ink);padding:24px;
   background-image:linear-gradient(rgba(127,166,214,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(127,166,214,.25) 1px,transparent 1px);
   background-size:24px 24px}
 img{display:block;width:100%;max-width:820px;margin:0 auto}
 blockquote{margin:18px 40px;font-size:18px;line-height:1.5;text-align:center}
 blockquote footer{font-size:14px;opacity:.75;margin-top:6px}
 table{width:100%;border-collapse:collapse;border:2px solid var(--ink);margin-top:18px}
 td{border:1px solid var(--ink);padding:6px 10px;vertical-align:top}
 .lbl{display:block;font-size:10px;opacity:.7}
 .big{font-size:20px;font-weight:bold}
</style></head><body><div class="sheet">
<img src="spikey.png" alt="Rhombic hexecontahedron in blue ink">
<blockquote>“Who first came up with the rhombic hexecontahedron? We don’t know, and perhaps we never will. But now that it is here, it’s forever.”
<footer>— Stephen Wolfram, on Spikey</footer></blockquote>
<table><tr>
<td><span class="lbl">TITLE</span><span class="big">RHOMBIC HEXECONTAHEDRON</span><br>after Spikey</td>
<td><span class="lbl">FACES</span>60 golden rhombi</td>
<td><span class="lbl">EDGES</span>120</td>
<td><span class="lbl">VERTICES</span>62</td>
<td><span class="lbl">SOURCE</span>PolyhedronData</td>
<td><span class="lbl">DRAWN</span>tuiCalc<br>2026-11-03</td>
</tr></table>
</div></body></html>
